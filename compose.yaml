services:
  nginx:
    build:
      context: ./docker/nginx
      cache_from:
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-php/nginx:${UNITMAN_UNIT_NAME}
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-php/nginx:latest
      cache_to:
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-php/nginx:${UNITMAN_UNIT_NAME},mode=max
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-php/nginx:latest,mode=max
    restart: always
    ports:
      - "8081:80"

  php:
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
      ccache_from:
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-php/php:${UNITMAN_UNIT_NAME}
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-php/php:latest
      cache_to:
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-php/php:${UNITMAN_UNIT_NAME},mode=max
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-php/php:latest,mode=max
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      APP_TITLE: ${UNITMAN_APP_TITLE:-defaultTitle}
    
